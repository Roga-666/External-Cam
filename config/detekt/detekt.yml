# Project overrides on top of detekt's default ruleset (buildUponDefaultConfig = true
# in app/build.gradle.kts). Every deviation below is explained in task-11-report.md.

naming:
  FunctionNaming:
    active: true
    # Composable functions follow the Jetpack Compose PascalCase convention
    # (UcvTheme, ViewerScreen, StreamingContent, ...), not detekt's default
    # lower-camel-case function naming.
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    active: true
    # Re-enabled project-wide (see fix-report in task-11-report.md); the two
    # files that intentionally group a top-level support type next to the
    # composable/feature it belongs to (ViewerScreen.kt, AppNav.kt) carry
    # their own file-level @file:Suppress with a one-line reason instead of a
    # blanket disable here.

style:
  MagicNumber:
    active: true
    # Re-enabled project-wide (see fix-report in task-11-report.md).
    # Composable-annotated functions are exempted: they're where the bulk of
    # the noise lived (Compose dp/sp sizes). Non-Compose offenders are fixed
    # with named constants, or suppressed individually with a reason.
    ignoreAnnotated: ['Composable']

complexity:
  TooManyFunctions:
    active: true
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    # CameraController (11), AusbcCameraController (13) and ViewerViewModel (13)
    # each expose one cohesive, narrow camera/viewer API surface designed in
    # earlier tasks; splitting them into smaller classes would fragment a
    # single responsibility rather than reduce it. Default threshold (11) is
    # bumped just enough to cover the existing, reviewed API shape.
