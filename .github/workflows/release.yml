name: Signed Release

on:
  push:
    # One-time first release triggered by merging the bootstrap file to main.
    # Later normal code changes will not publish releases.
    branches: [main]
    tags: ["v*"]
    paths:
      - docs/first-release-trigger.md

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Quality gates
        run: ./gradlew test detekt ktlintCheck lint

      - name: Resolve release tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            RELEASE_TAG="v0.1.0"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      # A different signature would prevent in-place Android updates.
      # Never publish a release artifact unless the permanent signing key is configured.
      - name: Require and decode permanent release signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing ${name}; refusing to publish an unsigned or differently signed APK."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "UCV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          UCV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          UCV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          UCV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify APK signature and name release asset
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" "External-Cam-${RELEASE_TAG}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: External Cam ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: External-Cam-*.apk
          generate_release_notes: true
